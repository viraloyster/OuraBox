# Publishes a version: pushing a tag like v0.1.0, or "Run workflow"
# in the Actions tab (which tags the app's current version), builds
# the Windows installer, checks it, and creates the release with its
# notes (the version's section in CHANGELOG.md, then
# .github/release-notes.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Creating the release needs write access; nothing else does.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # A tag that doesn't match the app's version would publish an
      # installer with the wrong number inside it.
      - name: Tag matches the app's version
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="$app"; fi
          if [ "$version" != "$app" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but the app is $app"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Interface tests
        run: npm test

      - name: Core tests
        working-directory: app/src-tauri
        run: cargo test

      - name: Build the installer
        run: npm run tauri build -- --bundles nsis

      - name: Installer and checksum
        run: |
          mkdir -p ../out
          cp src-tauri/target/release/bundle/nsis/OuraBox_${VERSION}_x64-setup.exe ../out/
          cd ../out && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release notes
        working-directory: .
        run: |
          awk -v v="## $VERSION" 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          sed "s/VERSION/$VERSION/g" .github/release-notes.md >> notes.md

      - uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: OuraBox ${{ env.VERSION }}
          body_path: notes.md
          files: |
            out/*.exe
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
