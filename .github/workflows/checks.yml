# The quick checks on every change: the interface (types, unit tests and the
# end-to-end flows in a real browser) and the core (format, lints and tests).
# They run on Linux, which is fast; building the Windows installer is
# windows.yml's job.
name: Checks

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/checks.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/checks.yml"]
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# Reading the code is all these jobs need.
permissions:
  contents: read

jobs:
  interface:
    name: Interface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The browser matches the pinned @playwright/test version.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14
          if-no-files-found: ignore

  core:
    name: Core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # What Tauri 2 builds against on Linux: the WebKitGTK webview and GTK
      # (also used by the file dialogs), plus libxdo for the menus' shortcuts.
      - name: Install Linux libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Format
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
