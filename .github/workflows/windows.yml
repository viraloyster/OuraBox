# Builds the OuraBox installer for Windows on every change, to catch
# what breaks it early. Each run keeps it under "Artifacts"; the
# installers people download come from release.yml.
name: Windows app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

# Reading the code is all these jobs need.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Interface tests
        run: npm test

      - name: Core tests
        working-directory: app/src-tauri
        run: cargo test

      - name: Build the installer
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: OuraBox-Windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
