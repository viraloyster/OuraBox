[package]
name = "ourabox"
version = "0.1.0"
description = "A safe space to develop genuine ideas"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/viraloyster/OuraBox"

[lib]
name = "ourabox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = "0.11.0"
zeroize = "1"
base64 = "0.23"
sha2 = "0.11"
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-opener = "=2.6.0"

[dev-dependencies]
tempfile = "3"

# Small, fast binary: OuraBox has to run well on modest computers.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
